<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="falling-balls.css">
        <title>
            Gok Site
        </title>
    </head>

    <body>
        <div class="top-bar">
            <a href="index.html" class="logo-top">
                <div class="gok-logo">
                    Gok
                </div>
                <div class="site-logo">
                    Site
                </div>
            </a>
            <div class="logo-divider"> </div>
        </div>
        <div class="side-panel">
            <button id="spawn-ball-button">
                Spawn Ball in Center
            </button>

            <div id="balance-display">Balance: 100</div>

            <label for="bet-input">Bet Amount:</label>
            <input type="number" id="bet-input" value="1" min="0.1" step="0.1">
            <button id="set-bet-amount">Set Bet</button>
        </div>
        
        <canvas id="falling-balls-canvas"></canvas>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
        <script src="falling-balls.js"></script>
    </body>
</html>
